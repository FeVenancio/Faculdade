<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
    <script>
        function mudarCor(cor) 
        {
            document.body.style.background = cor;
        }
    </script>
</head>
<body>
    
    <ol>
        <li><a href="" onmouseover="mudarCor('blue')">Azul</a></li>
        <li><a href="" onmouseover="mudarCor('black')">Preto</a></li>
        <li><a href="" onmouseover="mudarCor('red')">Vermelho</a></li>
        <li><a href="" onmouseover="mudarCor('white')">Branco</a></li>
    </ol>
</body>
</html>
