<form (ngSubmit)="adicionar()">

    <p>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="nome">
    </p>

    <p>
        <label for="email">Email</label>
        <input type="text" id="email" name="email" [(ngModel)]="email">
    </p>


    <h3>Escolha das Oficinas</h3>

    <p>
        <label>TomasAuto</label>
        <input type="radio" name="escolha-oficina" value="tomas-auto" [(ngModel)]="oficina">
    </p>

    <p>
        <label>Simas Turbo</label>
        <input type="radio" name="escolha-oficina" value="simas-turbo" [(ngModel)]="oficina">
    </p>

    <p>
        <label>Fiat Inteiro Auto</label>
        <input type="radio" name="escolha-oficina" value="fiat-inteiro-auto" [(ngModel)]="oficina">
    </p>

    <button type="submit">Cadastrar</button>

    <a routerLink="/lista">lista de inscrições</a>
</form>
