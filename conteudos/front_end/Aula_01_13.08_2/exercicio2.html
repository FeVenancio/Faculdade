<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
</head>
<body>
    <header>
        <h1>Exercicio 2</h1>
    </header>
    <main>
        <button id="main-button" onclick="button()">Data e hora atual</button>
        <p id="date-time"></p>
    </main>

    <script>
        let mainButton = document.getElementById('main-button');
        let dateTime = document.getElementById('date-time');

        function button(){

            let dateNow = new Date();
            let date = dateNow.toLocaleString("pt-BR");

            dateTime.innerText = date;
        }
    </script>
</body>
</html>
