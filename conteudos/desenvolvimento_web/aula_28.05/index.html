<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
</head>
<body>
    <header>
        <div>
            <h1>
                Bem Vindo ao meu Site!
            </h1>
        </div>
    </header>

    <main>
        <form action="#" method="post" id="form_cadastro"></form>

        <p>
            <fieldset>
                <legend>Informações pessoais</legend>
                <p>
                    <label for="user_nome">Nome:</label>
                    <input type="text" id="user_nome" name="nome" placeholder="Nome Completo">
                </p>
                <p>
                    <label for="user_email">Email:</label>
                    <input type="email" id="user_email" name="email" placeholder="nome@exemplo.com">
                </p>
            </fieldset>
        </p>
        <p>
            <fieldset>
                <legend>Formulario</legend>
                <p>
                    <label for="time">Escolha um time:</label>
                </p>
                <p>
                    <label><input type="radio" name="user_type" value="corinthians">Corinthians</label>
                </p>
                <p>
                    <label><input type="radio" name="user_type" value="real_madrid">Real Madrid</label>
                </p>
                <p>
                    <label><input type="radio" name="user_type" value="barcelona">Barcelona</label>
                </p>
                <p>
                    <label><input type="radio" name="user_type" value="sem_mundial">Sem mundial</label>
                </p>
            </fieldset>
        </p>
        <input type="submit" value="enviar">
        <input type="submit" value="limpar">
    </main>

    <footer>
        <div>
            <p>
                <small>
                    Site criado por Felipe Sanches Venâncio
                </small>
            </p>
        </div>
    </footer>
    <script src="site.js"></script>
</body>
</html>
